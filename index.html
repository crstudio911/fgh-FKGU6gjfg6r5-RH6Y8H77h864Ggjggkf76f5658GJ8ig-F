<main class="auth">
<form class="auth-card" id="login-form" novalidate>
<div class="auth-brand"><img src="img/logo.png" alt="شعار Smart Chemistry" width="40" height="46"><div><strong>Smart Chemistry</strong><span>CONTROL PANEL</span></div></div>
<div><h1>دخول لوحة التحكم</h1><p>للمطور والمالك والموظفين فقط.</p></div>
<p class="alert" id="login-alert" role="alert" hidden></p>
<div class="field"><label for="username">اسم المستخدم</label><input id="username" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required></div>
<div class="field"><label for="password">كلمة المرور</label><div class="pass-wrap"><input id="password" type="password" dir="ltr" autocomplete="current-password" maxlength="64" required><button type="button" class="icon-btn" id="toggle-pass" aria-label="إظهار كلمة المرور"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button></div></div>
<button class="btn primary full" id="login-btn" type="submit">دخول<svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg></button>
<div class="auth-foot"><span>الجلسة تنتهي بعد 12 ساعة أو بغلق المتصفح.</span><button type="button" class="icon-btn" data-theme-toggle aria-label="تغيير الوضع"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></button></div>
</form>
